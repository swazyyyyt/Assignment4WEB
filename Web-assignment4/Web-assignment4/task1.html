<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/task1.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <section class="ticket" aria-labelledby="form-title">
      <header class="ticket-head">
        <h1 id="form-title">Book a train ticket</h1>
      </header>

      <form class="ticket-body" action="#" method="get">
        <!-- One way / Round trip: two radio inputs -->
        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>
          <div class="trip-switch">
            <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
            <label class="btn" for="oneway">One way</label>
            <input type="radio" class="btn-check" name="trip" id="roundtrip" value="roundtrip">
            <label class="btn" for="roundtrip">Round trip</label>
          </div>
        </fieldset>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="from" name="from" placeholder="Astana" autocomplete="off" required>
              <label for="from">From</label>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" autocomplete="off" required>
              <label for="to">To</label>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-4">
            <label for="departure" class="form-label">Departure</label>
            <input type="date" class="form-control" id="departure" name="departure" required>
          </div>
          <div class="col-12 col-md-4">
            <label for="return" class="form-label">Return</label>
            <input type="date" class="form-control" id="return" name="return">
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select class="form-select" id="passengers" name="passengers" required>
              <option value="1" selected>1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <fieldset class="mb-4">
          <legend class="field-title fs-6 mb-2">Carriage class</legend>
          <div class="d-flex flex-wrap column-gap-4 row-gap-2">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="class" id="class-seat" value="seat" required>
              <label class="form-check-label" for="class-seat">Seat</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="class" id="class-coupe" value="coupe" checked required>
              <label class="form-check-label" for="class-coupe">Coupé</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="class" id="class-sleeper" value="sleeper" required>
              <label class="form-check-label" for="class-sleeper">Sleeper</label>
            </div>
          </div>
        </fieldset>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text prefix" id="phone-prefix">+7</span>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel-national" aria-describedby="phone-prefix" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="mb-2 form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
          <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
        </div>
        <div class="mb-4 form-check">
          <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
          <label class="form-check-label" for="agree">I agree with the carriage rules</label>
        </div>

        <div class="actions">
          <button type="reset" class="btn btn-clear">Clear</button>
          <button type="submit" class="btn btn-find">Find trains</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
