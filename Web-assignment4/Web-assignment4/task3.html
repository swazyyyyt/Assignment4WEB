<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <header class="topbar py-3">
    <div class="container"><a class="brand" href="index.html">Yerk<span>Sneaker</span> · Assignment 4</a></div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-6">
        <h1 class="h2 mb-4">Reserve a table</h1>

        <form class="form-card" action="#" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Your name</label>
            <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="guests" class="form-label">Guests</label>
              <input type="number" class="form-control" id="guests" name="guests" min="1" max="12" step="1" inputmode="numeric" required>
            </div>
            <div class="col-12 col-sm-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" name="date" required>
            </div>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label">Seating</legend>
            <div class="d-flex flex-wrap column-gap-4 row-gap-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="seating" id="seating-inside" value="inside" required>
                <label class="form-check-label" for="seating-inside">Inside</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="seating" id="seating-terrace" value="terrace" required>
                <label class="form-check-label" for="seating-terrace">Terrace</label>
              </div>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="meal" class="form-label">Meal</label>
            <select class="form-select" id="meal" name="meal" required>
              <option value="" selected disabled>Choose…</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="comments" class="form-label">Comments</label>
            <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
            <label class="form-check-label" for="terms">I agree to the terms</label>
          </div>

          <button type="submit" class="btn btn-accent">Reserve</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
